# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: frontendly-backend
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: O11Y_HEAP_THRESHOLD_BYTES
        value: 536870912
